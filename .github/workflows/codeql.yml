name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # The Java side holds the SSH credentials and builds every remote shell
    # command, so it is analysed as well as the WebView script.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            name: Analyze JavaScript and TypeScript
            category: .github/workflows/codeql.yml:analyze
          - language: java-kotlin
            name: Analyze Java and Kotlin
            category: .github/workflows/codeql.yml:analyze:java-kotlin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # Preserve the existing JavaScript baseline used by the ruleset.
          category: ${{ matrix.category }}
